:root{
  --paper:#fbf9f3; --paper-2:#f3eee2; --ink:#1d1b18;
  --earth:#9c3f26;
}
*{box-sizing:border-box}
html,body{min-height:100%}
html{height:100%; overflow-x:hidden; background-color:#f7f3ea}
/* The paper texture lives on a FIXED, viewport-sized layer. Putting it on <html>
   or <body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NPTZ8XF"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) --> fails: a root background image is positioned against the root box and
   does not extend to fill the canvas, so whenever the document is shorter than the
   viewport the leftover area shows only the flat background colour in an
   untextured band at the bottom of the page. */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none;
  background-color:#f7f3ea;
  background-image:
    /* wove fibres — two opposed fine diagonals */
    repeating-linear-gradient(46deg,  rgba(122,98,64,.075) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(-44deg, rgba(122,98,64,.065) 0 1px, transparent 1px 4px),
    /* laid chain lines */
    repeating-linear-gradient(0deg,   rgba(140,112,72,.07)  0 1px, transparent 1px 5px),
    /* soft mottling — kept gentle so the edges read as stock, not staining */
    radial-gradient(closest-side at 12% 16%, rgba(150,116,68,.10), transparent 80%),
    radial-gradient(closest-side at 88% 10%, rgba(122,98,64,.09), transparent 78%),
    radial-gradient(closest-side at 76% 82%, rgba(150,116,68,.10), transparent 80%),
    radial-gradient(closest-side at 16% 90%, rgba(122,98,64,.09), transparent 78%),
    /* a calmer zone behind the type */
    radial-gradient(closest-side at 50% 48%, rgba(255,255,252,.52), transparent 58%),
    /* edge vignette */
    radial-gradient(125% 105% at 50% 42%, rgba(255,254,250,0) 42%, rgba(142,112,74,.16) 100%),
    /* base sheet */
    radial-gradient(135% 105% at 50% -12%, #fffefa 0%, var(--paper) 46%, var(--paper-2) 100%);
}
body{
  margin:0; padding:clamp(24px,6vw,80px) clamp(20px,5vw,64px); min-height:100svh;
  color:var(--ink); font-family:'EB Garamond',Garamond,Georgia,serif;
  display:grid; place-items:center; -webkit-font-smoothing:antialiased;
}
/* fine tooth: a two-layer dot screen, offset to avoid moiré */
body::after{
  content:''; position:fixed; inset:0; pointer-events:none;
  mix-blend-mode:multiply; opacity:.62;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(108,86,54,.32) 0 .5px, rgba(0,0,0,0) 1px),
    radial-gradient(circle at 50% 50%, rgba(108,86,54,.22) 0 .5px, rgba(0,0,0,0) 1px);
  background-size:3px 3px, 3px 3px;
  background-position:0 0, 1.5px 1.5px;
}
/* .sheet must be positioned, otherwise the fixed paper layer (a positioned
   element) paints ABOVE this static content and the page renders blank */
.sheet{position:relative; width:100%; max-width:660px; text-align:center}

.hair.short{height:0; width:clamp(48px,14vw,90px); margin:clamp(18px,3.4vw,28px) auto 0;
  border-top:2px solid rgba(156,63,38,.75)}

h1{
  margin:clamp(6px,1.4vw,12px) 0 0; font-family:'Great Vibes',cursive; font-weight:400;
  font-size:clamp(76px,20vw,182px); line-height:.98; color:var(--ink);
  overflow-wrap:anywhere;
}
.rail{
  display:flex; justify-content:center; align-items:center; flex-wrap:wrap;
  gap:clamp(12px,2.6vw,24px); margin:clamp(20px,3.8vw,30px) 0 0;
}
.rail b{
  font-weight:400; font-size:clamp(40px,10.5vw,78px); line-height:1; color:var(--ink);
  font-family:'EB Garamond',Georgia,serif;
  border-bottom:2px solid rgba(156,63,38,.62); padding-bottom:5px;
}
/* the syllable separators: an explicit CSS circle rather than the "·" glyph,
   because the glyph's ink is only ~6px at 64px type (and 3px on a phone) — the
   circle can be sized predictably at every width. margin-bottom lifts it to the
   optical centre of the lowercase syllables, which sit above their underlines. */
.rail i{display:block; flex:0 0 auto; font-size:0; line-height:0;
  width:clamp(10px,2vw,16px); height:clamp(10px,2vw,16px);
  border-radius:50%; background:var(--earth); opacity:.85; margin-bottom:7px}

@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<main class="sheet">
  <h1>Isriel</h1>
  <div class="hair short"></div>

  <p class="rail" aria-label="Three syllables">
    <b>is</b><i aria-hidden="true">·</i><b>ree</b><i aria-hidden="true">·</i><b>el</b>
  </p>
</main>
</body>
</html>
